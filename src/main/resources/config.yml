# Config version - do not edit.
# The plugin uses it to add newly introduced keys on upgrade; your own values
# are kept, and the previous file is backed up as config-v<n>.yml.bak first.
config-version: 5

# ====================================
# Source location settings
# ====================================
source:
  # World name where the radioactive source spawns
  world: world
  
  # Define the search area using two corners
  # Top-left corner (smaller X, smaller Z)
  top-left:
    x: -1000.0
    z: -1000.0
  
  # Bottom-right corner (larger X, larger Z)
  bottom-right:
    x: 1000.0
    z: 1000.0

  # ====================================
  # Rules deciding where the source is allowed to spawn
  # A random spot is re-rolled until it passes every enabled rule
  # ====================================
  spawn-filters:
    # How many spots to try before giving up and using the last one anyway.
    # Chunks load asynchronously, so a high value costs search time (the source
    # is briefly inactive) rather than main-thread lag.
    max-attempts: 50

    # Reject spots where the source would land on water or lava
    # (also catches waterlogged blocks, kelp, seagrass, etc.)
    reject-liquid: true

    # Reject spots with no ground in the column (void / empty chunks)
    reject-void: true

    # Extra ground blocks the source may never spawn on
    # Uses vanilla material names, e.g. MAGMA_BLOCK, POWDER_SNOW
    blocked-blocks: []

    # Minimum horizontal distance (blocks) from the world spawn point
    # Set to 0 to disable
    min-distance-from-spawn: 250.0

    # WorldGuard region blacklist (ignored when WorldGuard is not installed)
    worldguard:
      enabled: true
      # Region IDs the source may not spawn inside
      blacklisted-regions: []

# ====================================
# Detection settings
# ====================================
detection:
  # Maximum distance to collect the radioactive source (blocks)
  collection-distance: 20.0
  
  # Maximum distance for Geiger Counter detection (blocks)
  max-detection-distance: 2500.0
  
  # Distance threshold for close/far range colors (blocks)
  close-range-threshold: 200.0
  
  # Ring count thresholds - number of particle rings based on distance
  ring-thresholds:
    three-rings: 100.0  # Show 3 rings when closer than this distance
    two-rings: 300.0    # Show 2 rings when closer than this distance (otherwise 1 ring)


# ====================================
# Geiger clicking sound
# Distance controls how FAST the counter clicks, not the pitch - that is what
# a real Geiger-Muller tube does. Clicks are rolled per tick, so their spacing
# is irregular instead of metronome-even.
# Only the player holding the counter hears it.
# ====================================
sound:
  enabled: true

  # Sound event ID (see https://minecraftsounds.com to preview)
  # Other good clicks: block.dispenser.fail, block.comparator.click
  sound: block.note_block.hat

  # 0.0 - 1.0 for a personal readout; higher carries further
  volume: 0.35

  # Base pitch (0.5 - 2.0) and how far each click may wander from it,
  # so repeats do not sound like a loop
  pitch: 1.7
  pitch-variance: 0.15

  # Clicks per second at max-detection-distance and at the source itself.
  # 20 is the ceiling - one click per tick
  min-rate: 0.5
  max-rate: 18.0

  # Higher values keep the clicking slow until the player is close,
  # then ramp hard. 1.0 is a straight line
  curve: 2.0


# ====================================
# Per-player drop limits
# A player may collect at most <drops> sources within any <time> window.
# The window slides: each collection frees up again exactly <time> after it
# happened, so 3 drops per 12h works out to 6 per day.
# Players with the geiger.limit.bypass permission are never limited.
# ====================================
limits:
  enabled: true

  # Max sources one player may collect per window
  drops: 3

  # Window length - accepts s, m, h, d (e.g. 30s, 45m, 12h, 1d)
  time: 12h


# ====================================
# Particle effect colors (RGB format: 0-255)
# ====================================
colors:
  # Close range (0 to close-range-threshold blocks)
  close-range:
    # Starting color (closest to source)
    start:
      red: 255
      green: 255
      blue: 255  # White
    # Ending color (at threshold distance)
    end:
      red: 255
      green: 0
      blue: 255  # Purple
  
  # Far range (close-range-threshold to max-detection-distance)
  far-range:
    # Starting color (at threshold distance)
    start:
      red: 255
      green: 0
      blue: 255  # Purple
    # Ending color (at max distance)
    end:
      red: 17
      green: 0
      blue: 17  # Dark Purple


# ====================================
# Reward items when players find the source
# Tiered rarity system with weighted chances
# ====================================
drops:
  # Weights for each rarity tier
  tier-weights:
    common: 45      # 45% chance
    uncommon: 30    # 30% chance
    rare: 15        # 15% chance
    epic: 7         # 7% chance
    legendary: 2.5  # 2.5% chance
    mythical: 0.5   # 0.5% chance
  
  # Which list under drops.lists is in use.
  # Switch in-game with /geiger droplist <name> - it saves here and reloads.
  active-list: default

  # Named drop lists - add as many as you like, names are free-form.
  # Items in each rarity tier
  # Format: "item_path:amount"
  # Example: m.MATERIALS.ARCANE_DUST:5
  lists:
