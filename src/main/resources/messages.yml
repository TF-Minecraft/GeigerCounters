# ====================================
# All text the plugin sends to someone in chat.
# Supports & color codes and hex colors (&#RRGGBB).
# Placeholders are written %like-this% - each message lists its own below.
#
# Console log lines are NOT here: they stay in English so server logs and
# bug reports remain readable no matter how this file is translated.
# ====================================


# ====================================
# PLAYER - seen by anyone hunting the source
# ====================================
player:
  # Shown when a player finds the radioactive source
  found-source: "&#AA00FFYou have found the source of Arcane Radiation! &#FFFF00The source has moved."

  # Shown when the Geiger Counter burns out after finding the source
  dead-geiger: "&7Your Arcane Trace Detector has run out of fuel."

  # Shown when a player has used up their drops for the current window
  # %max%    = drops allowed per window
  # %window% = window length (e.g. 12h)
  # %time%   = time until their next drop frees up
  limit-reached: "&cYou have already collected %max% sources in %window%. Try again in %time%."


# ====================================
# ADMIN - only ever seen by whoever runs /geiger
# ====================================
admin:
  # /geiger with no arguments, or an unknown subcommand
  usage: "&eUsage: /geiger <locate|move [x z]|limits <player>|resetlimits <player>|droplist [name]|reload>"

  # /geiger locate
  # %x% %z% = source coordinates, %world% = world name
  source-located: "&aRadioactive source is at X = %x% Z = %z% (world: %world%)"

  # /geiger locate while the source is mid-relocation
  source-relocating: "&cNo active radioactive source - it is being relocated right now."

  # /geiger move
  move-searching: "&7Searching for a new source location..."
  move-usage: "&cUsage: /geiger move [x z]"
  move-invalid-coords: "&cCoordinates must be numbers. Usage: /geiger move [x z]"
  move-failed: "&cThe source could not be moved."
  # %x% %z% = where the source ended up
  move-success: "&aRadioactive source moved to X = %x% Z = %z%"

  # /geiger limits <player>
  limits-usage: "&cUsage: /geiger limits <player>"
  limits-disabled: "&7Drop limits are disabled in the config."
  # %player% = target, %remaining% / %max% = drops left, %window% = window length
  limits-status: "&a%player% has %remaining%/%max% drops left per %window%."
  # %time% = wait until the target's next drop frees up
  limits-next-drop: "&7Next drop available in %time%."

  # /geiger resetlimits <player>
  resetlimits-usage: "&cUsage: /geiger resetlimits <player>"
  # %player% = target
  resetlimits-success: "&aDrop limit reset for %player%."

  # Any subcommand given a name nobody on this server has used
  # %player% = the name that was typed
  unknown-player: "&cUnknown player: %player%"

  # /geiger droplist [name]
  droplist-usage: "&cUsage: /geiger droplist [name]"
  # %list% = active list, %lists% = every list in config.yml
  droplist-current: "&aActive drop list: &f%list% &7(available: %lists%)"
  droplist-unknown: "&cNo drop list named '%list%'. Available: %lists%"
  droplist-changed: "&aDrop list switched to &f%list%&a."

  # /geiger reload
  reloaded: "&aGeiger Counter configuration reloaded."
