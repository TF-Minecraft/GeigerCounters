main: tfmc.justin.geiger_counter
version: ${project.version}
name: geiger_counter
author: Justin
api-version: '1.21.10'
depend: [TLibs]
softdepend: [WorldGuard]
commands:
  geiger:
    description: Geiger Counter admin commands
    usage: /geiger <locate|move [x z]|limits <player>|resetlimits <player>|droplist [name]|reload>
    permission: geiger.admin
permissions:
  geiger.admin:
    description: Access to Geiger Counter admin commands
    default: op
  geiger.limit.bypass:
    description: Exempt from the per-player drop limit
    default: op
